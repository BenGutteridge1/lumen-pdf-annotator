<title>Lumen desktop selection palette checks</title><link rel="stylesheet" href="styles.css">
<style>
:root{font:13px system-ui;color:#24262c;background:#edf0f5;--text-normal:#24262c;--text-muted:#667085;--text-faint:#9aa0ae;--background-primary:white;--background-secondary:#f5f6fa;--background-modifier-border:#d7dce5;--interactive-accent:#6955dc;--interactive-accent-hsl:249,65%,60%;--text-on-accent:white;--font-interface:system-ui;--font-text:system-ui;--font-ui-small:13px;--radius-s:5px;--radius-m:8px}

let view,files,ready,clipboard=[];
async function boot(){Platform.isMobile=false;const bytes=pdfBytes();files=new Map();const adapter={exists:async path=>files.has(path),read:async path=>files.get(path),write:async(path,text)=>files.set(path,text),mkdir:async path=>files.set(path,''),append:async(path,text)=>files.set(path,(files.get(path)||'')+text),list:async path=>({files:[...files.keys()].filter(file=>file.startsWith(`${path}/`)),folders:[]})};const app={vault:{adapter,readBinary:async()=>bytes.slice(0),getName:()=>'Synthetic test vault'},scope:{},workspace:{getLeavesOfType:()=>[]}};view=new LumenPdfView({app,containerEl:document.querySelector('#reader'),contentEl:document.querySelector('.view-content')});view.file=new TFile('Selection geometry.pdf',bytes.byteLength);await view.onOpen();await view.onLoadFile(view.file);await until(()=>view.pages.get(1)?.textReady);view.writeClipboard=async text=>{clipboard.push(text);};window.paletteView=view;document.querySelector('#status').textContent='Ready: select any PDF text or run checks';return view;}
ready=boot();window.paletteReady=ready;
const runs=page=>view.pages.get(page)?.quoteTextRuns?.filter(run=>run.text.trim())||[];
async function mounted(page){view.restorePage(page);await until(()=>view.pages.get(page)?.textReady);return runs(page);}
async function alignLine(line=6,offset=220,page=1){await mounted(page);const target=runs(page)[line].element.getBoundingClientRect();const root=view.scrollEl.getBoundingClientRect();view.scrollEl.scrollTo({top:view.scrollEl.scrollTop+target.top-root.top-offset,behavior:'instant'});await frame();await frame();}
function point(run,offset){const node=run.element.firstChild,range=document.createRange();range.setStart(node,Math.min(offset,node.length-1));range.setEnd(node,Math.min(offset+1,node.length));const rect=range.getBoundingClientRect();return{x:rect.left+.15,y:rect.top+rect.height/2};}
window.paletteDragPlan=async({startLine=5,endLine=7,startOffset=5,endOffset=45,reverse=false,offset=220,page=1}={})=>{await ready;view.closeSelectionPalette();view.suppressNextSelectionCapture=false;await alignLine(startLine,offset,page);const pageRuns=runs(page),start=point(pageRuns[startLine],startOffset),end=point(pageRuns[endLine],endOffset);return{start:reverse?end:start,end:reverse?start:end,page,startLine,endLine,reverse};};

function snapshot(){const palette=view.selectionPalette;if(!palette)return{open:false};const rect=palette.getBoundingClientRect(),root=view.scrollEl.getBoundingClientRect(),toolbar=view.toolbarEl.getBoundingClientRect(),range=view.selection.nativeRange.getBoundingClientRect();const bounds={left:Math.max(0,root.left)+12,right:Math.min(innerWidth,root.left+view.scrollEl.clientWidth)-12,top:Math.max(0,root.top,toolbar.bottom)+12,bottom:Math.min(innerHeight,root.top+view.scrollEl.clientHeight)-12};return{open:true,placement:palette.dataset.placement,quote:view.selection.quote,pages:[...view.selection.pages.keys()],palette:{left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom,width:rect.width,height:rect.height},text:{left:range.left,right:range.right,top:range.top,bottom:range.bottom},bounds,gap:palette.dataset.placement==='below'?rect.top-range.bottom:range.top-rect.bottom,inBounds:rect.left>=bounds.left-.5&&rect.right<=bounds.right+.5&&rect.top>=bounds.top-.5&&rect.bottom<=bounds.bottom+.5,actions:[...palette.querySelectorAll('button')].map(button=>button.ariaLabel)};}
window.paletteSelect=select;window.paletteSnapshot=snapshot;window.paletteAlignLine=alignLine;
window.runPaletteChecks=async()=>{await ready;const checks=[],details={};document.querySelector('#run').disabled=true;document.querySelector('#results').replaceChildren();const check=(label,value)=>{assert(value,label);checks.push(label);element('li',{text:`PASS · ${label}`,cls:'pass'},document.querySelector('#results'));};window.paletteHarnessResult={status:'running',checks};try{const reader=document.querySelector('#reader');reader.style.width='960px';reader.style.height='650px';await view.restoreZoom(1.25);await mounted(1);
const forward=await select();const reverse=await select({reverse:true});details.direction={forward,reverse};check('Forward and reverse native PDF selections produce identical palette geometry',forward.quote===reverse.quote&&['left','top','width','height'].every(key=>Math.abs(forward.palette[key]-reverse.palette[key])<.5));check('Multiline selection has a comfortable 16px gap below and stays in its reader',reverse.placement==='below'&&reverse.gap>=15.5&&reverse.inBounds);
const targetBottom=reverse.text.bottom+reverse.palette.height+20;reader.style.height=`${targetBottom-reader.getBoundingClientRect().top}px`;await delay(80);const above=snapshot();details.resizeAbove=above;check('Resizing the pane flips the existing palette above without covering text',above.placement==='above'&&above.gap>=15.5&&above.inBounds);reader.style.height='650px';await delay(80);check('Growing the pane dynamically returns the palette below',snapshot().placement==='below');
view.scrollEl.scrollTop+=155;await delay(80);const scrolled=snapshot();details.scrolled=scrolled;check('Scrolling updates the same palette from text geometry',scrolled.placement==='below'&&scrolled.gap>=15.5&&scrolled.inBounds);
// Use a late paragraph so the measured target requires positive scrolling.
await select({startLine:20,endLine:22});
const bottomSetup=snapshot(),bottomRoom=Math.min(8,bottomSetup.palette.height/2);
const bottomScrollTop=view.scrollEl.scrollTop+bottomSetup.text.bottom-(bottomSetup.bounds.bottom-bottomRoom);
assert(bottomScrollTop>0,'Bottom-edge fixture must be reachable without clamping at scrollTop zero');
view.scrollEl.scrollTo({top:bottomScrollTop,behavior:'instant'});
await frame();await frame();await delay(80);
const nearBottom=snapshot();details.nearBottom={...nearBottom,targetRoomBelow:bottomRoom,actualRoomBelow:nearBottom.bounds.bottom-nearBottom.text.bottom};

await view.restoreZoom(1.7);await mounted(1);const zoomed=await select();details.zoomed=zoomed;check('Selection at 170% zoom uses the rendered text bounds',zoomed.gap>=15.5&&zoomed.inBounds);
await view.restoreZoom(.6);await mounted(1);await mounted(2);await alignLine(23,170);const multipage=await select({startLine:23,endLine:2,page:1,endPage:2,align:false});details.multipage=multipage;check('Selection across PDF pages retains both pages and reachable controls',multipage.pages.length===2&&multipage.inBounds);
await view.restoreZoom(1.25);await mounted(1);reader.style.width='360px';await delay(100);const narrow=await select({startLine:5,endLine:6,startOffset:0,endOffset:20});details.narrow=narrow;check('Narrow desktop panes wrap palette controls inside the pane',narrow.inBounds&&narrow.actions.length===13);reader.style.width='960px';await delay(100);
await select();const quote=view.selection.quote;view.selectionPalette.querySelector('[aria-label="Copy selected text"]').click();await frame();check('Copy uses the complete captured quote and closes the palette',clipboard.at(-1)===quote&&!view.selectionPalette);

const mark=view.pages.get(1).markHost.querySelector(`[data-annotation-id="${first.id}"]`);mark.click();check('Saved highlights still open the annotation editor',Boolean(view.editor));view.closeEditor();view.beginExtension(first);await select({startLine:6,endLine:6});const extension=snapshot();details.extension=extension;check('Extension palette uses the same selection geometry and retains Apply/Cancel controls',extension.inBounds&&extension.gap>=15.5&&extension.actions.includes('Apply extension')&&extension.actions.includes('Cancel extension'));view.selectionPalette.querySelector('[aria-label="Apply extension"]').click();check('Applying extension keeps the annotation and adds selected text',view.index.get(first.id).quote.includes('line 07')&&!view.selectionPalette&&!view.extensionGroupId);
await select({startLine:5,endLine:7});await until(()=>[...view.pages.values()].every(state=>!state.rendering&&!state.textRendering));await delay(650);const counters={renders:0,mounts:0,marks:0,releases:0,positions:0,pageRects:0,rangeRects:0},restores=[];for(const[method,key]of[['mountPage','mounts'],['renderMarks','marks'],['releasePageLayers','releases'],['positionSelectionPalette','positions']]){const original=view[method];view[method]=function(...args){counters[key]++;return original.apply(this,args);};restores.push(()=>view[method]=original);}for(const state of view.pages.values()){if(state.page){const original=state.page.render;state.page.render=function(...args){counters.renders++;return original.apply(this,args);};restores.push(()=>state.page.render=original);}const original=state.shell.getBoundingClientRect;state.shell.getBoundingClientRect=function(...args){counters.pageRects++;return original.apply(this,args);};restores.push(()=>state.shell.getBoundingClientRect=original);}const nativeRange=view.selection.nativeRange,originalRects=nativeRange.getClientRects;nativeRange.getClientRects=function(){counters.rangeRects++;return originalRects.call(this);};restores.push(()=>nativeRange.getClientRects=originalRects);const before=canvases.map(node=>({node,width:node.width,height:node.height})),canvasCount=canvases.length;for(let i=0;i<120;i++){view.scrollEl.dispatchEvent(new Event('scroll'));dispatchEvent(new Event('resize'));}await frame();await frame();const coalesced=counters.positions;await delay(200);details.performance={...counters,coalesced,canvasCountStable:canvases.length===canvasCount,canvasBackingStable:before.every(({node,width,height})=>node.width===width&&node.height===height)};restores.forEach(restore=>restore());check('Visible palette event bursts coalesce with no idle placement loop or native-range rescans',coalesced<=2&&counters.positions===coalesced&&counters.rangeRects===0&&counters.pageRects<=4);check('Palette positioning creates no PDF renders
