    await frame();await frame();
    const scrolled=snapshot(),distance=scroller.scrollTop-startScroll;
    details.scroll={before:below,after:scrolled,startScroll,targetScroll,maxScroll,distance};
    check('The same row follows a 28px scroll and preserves the 16px text gap',
      approx(distance,28)&&approx(below.text.top-scrolled.text.top,distance)&&approx(below.palette.top-scrolled.palette.top,distance)
      &&below.placement==='below'&&scrolled.placement==='below'&&approx(below.gap,16)&&approx(scrolled.gap,16)
      &&scrolled.quote===below.quote&&view.selectionPalette===scrollingRow);
    reader.style.height=`${scrolled.text.bottom+45-reader.getBoundingClientRect().top}px`;
    await delay(100);
    const flipped=snapshot();details.flipped=flipped;
    check('The palette flips above with a 16px gap when the pane becomes short',flipped.placement==='above'&&approx(flipped.gap,16));
    colourTrigger().click();await frame();await frame();
    const shortened=measure(picker()),flippedRow=measure(view.selectionPalette);
    const shortPicker=picker(),buttonHeights=pickerButtons().map(button=>measure(button).height);
    details.shortened={shortened,flippedRow,buttonHeights,pickerScrollHeight:shortPicker.scrollHeight,placement:shortPicker.dataset.placement};
    check('The picker stays apart from its row and scrolls when short without shrinking its options',
      shortened.height<125&&shortPicker.scrollHeight>shortPicker.clientHeight&&buttonHeights.every(height=>height===26)
      &&(approx(flippedRow.top-shortened.bottom,8)||approx(shortened.top-flippedRow.bottom,8)));
    shortPicker.scrollTo({top:shortPicker.scrollHeight,behavior:'instant'});await frame();
    check('Scrolling the short picker reaches its last full-size option',
      shortPicker.scrollTop>0&&measure(pickerButtons().at(-1)).bottom<=shortened.bottom-.5&&view.selectionPalette.contains(shortPicker));
    await until(()=>[...view.pages.values()].every(state=>!state.rendering&&!state.textRendering));await delay(650);
    const counts={positions:0,rangeRects:0,renders:0,marks:0,keyboardProbes:0};
    const originals=[[view,'positionSelectionPalette','positions'],[Range.prototype,'getClientRects','rangeRects'],[view,'renderMarks','marks'],[view,'startMobileKeyboardProbe','keyboardProbes']];
    for(const state of view.pages.values())if(state.page)originals.push([state.page,'render','renders']);
    const restores=originals.map(([host,method,counter])=>{const original=host[method];host[method]=function(...args){counts[counter]++;return original.apply(this,args);};return()=>host[method]=original;});
    try{
      colourTrigger().click();colourTrigger().click();
      for(let i=0;i<120;i++){visualViewport.dispatchEvent(new Event('scroll'));dispatchEvent(new Event('resize'));}
      await frame();await frame();await delay(150);
      const positions=counts.positions;await delay(150);
      details.performance={...counts};
      check('Picker and viewport bursts use cached geometry, with no PDF rendering, repaint or keyboard probing',
        positions<=3&&counts.positions===positions&&counts.rangeRects===0&&counts.renders===0&&counts.marks===0&&counts.keyboardProbes===0);
      document.querySelector('h1').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));
      const closed=counts.positions;visualViewport.dispatchEvent(new Event('scroll'));await delay(100);
      check('Outside touch closes both surfaces and removes placement listeners',!view.selectionPalette&&counts.positions===closed);
    }finally{restores.forEach(restore=>restore());}
    window.paletteHarnessResult={status:'passed',passed:checks.length,checks,details};
    document.querySelector('#status').textContent=`${checks.length} mobile palette checks passed.`;
  }catch(error){
    window.paletteHarnessResult={status:'failed',passed:checks.length,checks,details,error:error.stack};
    document.querySelector('#status').textContent=`Failed: ${error.message}`;
    element('li',{text:error.stack,cls:'fail'},document.querySelector('#results'));console.error(error);
  }finally{run.disabled=false;}
  return window.paletteHarnessResult;
}
window.runPaletteChecks=mobile?runMobileChecks:runDesktopChecks;
document.querySelector('#run').onclick=window.runPaletteChecks;
</script></html>
