name: Publish Lumen 1.0.14

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-1.0.14.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          if (manifest.version !== '1.0.14' || pkg.version !== '1.0.14') throw new Error('Release metadata is not 1.0.14');
          if (lock.version !== '1.0.14' || lock.packages?.['']?.version !== '1.0.14') throw new Error('Lockfile is not 1.0.14');
          if (!versions['1.0.14']) throw new Error('versions.json is missing 1.0.14');
          const source = fs.readFileSync('src/view.ts', 'utf8');
          if (!source.includes('context.globalAlpha = .30;')) throw new Error('30% highlighter opacity is missing');
          NODE

      - name: Remove one-shot publisher and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-1.0.14.yml
          git commit -m "Remove one-shot 1.0.14 publisher"
          git push origin HEAD:main
          git tag 1.0.14
          git push origin 1.0.14
