name: Release plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag and manifest versions
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$manifest_version"
          test "$manifest_version" = "$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Create release archive
        run: zip -j "lumen-pdf-annotator-${GITHUB_REF_NAME}.zip" dist/main.js dist/manifest.json dist/styles.css LICENSE THIRD_PARTY_NOTICES.md licenses/Apache-2.0.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/Apache-2.0.txt
            lumen-pdf-annotator-${{ github.ref_name }}.zip
